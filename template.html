<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抖音渠道分析看板 v13</title>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#2c3e50;line-height:1.6;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;padding:28px 36px;position:relative;overflow:hidden;border-bottom:3px solid rgba(255,255,255,.05)}
.header::before{content:'';position:absolute;top:-60%;right:-5%;width:500px;height:500px;background:radial-gradient(circle,rgba(83,178,255,.12) 0%,transparent 70%);border-radius:50%}
.header::after{content:'';position:absolute;bottom:-40%;left:10%;width:350px;height:350px;background:radial-gradient(circle,rgba(157,78,221,.08) 0%,transparent 70%);border-radius:50%}
.header h1{font-size:24px;font-weight:700;letter-spacing:1px;position:relative;z-index:1;background:linear-gradient(90deg,#fff,#a8d8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .sub{font-size:12px;opacity:.7;margin-top:8px;position:relative;z-index:1;font-weight:300;letter-spacing:.3px;color:#8899bb}
.container{max-width:1480px;margin:0 auto;padding:24px 28px}
.card{background:#fff;border-radius:12px;animation:cardFadeIn .4s ease;box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);margin-bottom:20px;overflow:hidden;transition:box-shadow .25s ease;position:relative;border:1px solid rgba(0,0,0,.04)}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
@keyframes cardFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-header{padding:16px 22px;border-bottom:1px solid #f0f0f0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;background:#fafbfc;color:#1a1a2e}
.card-body{padding:22px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi-item{border-radius:10px;padding:22px 18px;text-align:center;position:relative;overflow:hidden;transition:all .25s ease;cursor:pointer}
.kpi-item::before{content:'';position:absolute;top:-20%;right:-15%;width:140px;height:140px;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 70%);border-radius:50%}
.kpi-item:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.kpi-item{background:linear-gradient(135deg,#4361ee 0%,#3a0ca3 100%);color:#fff}
.kpi-item:hover{box-shadow:0 8px 20px rgba(67,97,238,.35)}
.kpi-item.green{background:linear-gradient(135deg,#06d6a0 0%,#00b4d8 100%)}
.kpi-item.green:hover{box-shadow:0 8px 20px rgba(6,214,160,.35)}
.kpi-item.orange{background:linear-gradient(135deg,#f77f00 0%,#fcbf49 100%)}
.kpi-item.orange:hover{box-shadow:0 8px 20px rgba(247,127,0,.35)}
.kpi-item.blue{background:linear-gradient(135deg,#4895ef 0%,#4cc9f0 100%)}
.kpi-item.blue:hover{box-shadow:0 8px 20px rgba(72,149,239,.35)}
.kpi-label{font-size:13px;opacity:.9;margin-bottom:6px;font-weight:500;position:relative;z-index:1}
.kpi-value{font-size:30px;font-weight:800;margin-bottom:2px;position:relative;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.1)}
.kpi-sub{font-size:11px;opacity:.8;margin-top:4px;position:relative;z-index:1;font-weight:400}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-box{height:380px;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{background:#f8f9fa;padding:11px 14px;text-align:left;font-weight:600;border-bottom:2px solid #e9ecef;white-space:nowrap;color:#495057;font-size:12px;letter-spacing:.3px}
td{padding:10px 14px;border-bottom:1px solid #f5f5f5;color:#2c3e50;font-size:13px}
tr:hover{background:#f8f9ff}
tbody tr:nth-child(even){background:#fafbfc}
tbody tr:nth-child(even):hover{background:#f0f4ff}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-red{background:#fff1f0;color:#cf1322}
.tag-green{background:#f6ffed;color:#389e0d}
.tag-blue{background:#e6f7ff;color:#1890ff}
.tag-orange{background:#fff7e6;color:#d46b08}
.btn{display:inline-block;padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid #d9d9d9;background:#fff;color:#495057;transition:all .2s ease;font-weight:500}
.btn:hover{border-color:#4361ee;color:#4361ee;transform:translateY(-1px)}
.btn-primary{background:#4361ee;color:#fff;border-color:#4361ee}
.btn-primary:hover{background:#3a0ca3;color:#fff;transform:translateY(-1px);box-shadow:0 2px 8px rgba(67,97,238,.3)}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:90%;max-width:900px;max-height:80vh;overflow:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:modalSlideIn .3s ease}
@keyframes modalSlideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{margin-bottom:16px;font-size:18px;font-weight:600;color:#1a1a2e;border-bottom:2px solid #f0f0f0;padding-bottom:12px}
.modal .close-btn{float:right;cursor:pointer;font-size:20px;color:#999;transition:color .2s}
.modal .close-btn:hover{color:#333}
.search-bar{margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;background:#f8f9fa;border-radius:10px;border:1px solid #e9ecef}
.search-bar input,.search-bar select{padding:7px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;transition:all .2s ease;background:#fff}
.search-bar input:focus,.search-bar select:focus{border-color:#4361ee;outline:none;box-shadow:0 0 0 3px rgba(67,97,238,.1)}
.search-bar select{max-width:180px;cursor:pointer}
.conclusion{background:linear-gradient(135deg,#f8f9ff 0%,#eef2ff 100%);border-radius:12px;padding:20px 24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid rgba(67,97,238,.08);border-left:4px solid #4361ee}
.conclusion h3{color:#4361ee;margin-bottom:12px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.conclusion h3::before{content:'💡';font-size:18px}
.conclusion ul{padding-left:18px}
.conclusion li{margin-bottom:6px;font-size:13px;color:#2c3e50;line-height:1.7}
.metric-row{cursor:pointer}
.metric-row:hover{background:#eef2ff !important}
.legend-bar{display:flex;gap:14px;margin-bottom:12px;font-size:12px;color:#666;flex-wrap:wrap}
.legend-bar span{display:flex;align-items:center;gap:4px}
.legend-dot{width:12px;height:12px;border-radius:2px;display:inline-block}
.filter-label{font-size:12px;color:#888;margin-right:2px;font-weight:500}
th.sortable{cursor:pointer;user-select:none;position:relative;padding-right:18px}
th.sortable:hover{background:#eef2ff}
th.sortable .sort-icon{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:10px;color:#bbb;line-height:1}
th.sortable.sort-asc .sort-icon::after{content:'▲';color:#4361ee}
th.sortable.sort-desc .sort-icon::after{content:'▼';color:#4361ee}
.chart-filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.chart-filter-btn{padding:4px 14px;border-radius:20px;font-size:12px;cursor:pointer;border:2px solid #e0e0e0;background:#fff;color:#666;transition:all .2s ease;font-weight:500}
.chart-filter-btn:hover{border-color:#aaa}
.chart-filter-btn.active-tf{border-color:#5470c6;background:#5470c6;color:#fff}
.chart-filter-btn.active-zr{border-color:#91cc75;background:#91cc75;color:#fff}
.chart-filter-btn.active-total{border-color:#fac852;background:#fac852;color:#fff}
@media(max-width:768px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.compare-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>抖音渠道分析看板</h1>
    <div class="sub">数据截至: 20260624 | 时间口径：家庭单回溯后订单进线时间 | 渠道口径：渠道名称-回溯家庭单后</div>
  </div>
</div>

<div class="container">

<div class="conclusion">
  <h3>核心发现</h3>
  <ul id="conclusionList"></ul>
</div>

<div class="card">
  <div class="card-header">KPI 总览</div>
  <div class="card-body">
    <div class="kpi-grid" id="kpiGrid"></div>
  </div>
</div>


<div class="card">
  <div class="card-header">
    <span>📈 每日进线量走势</span>
    <button class="btn" data-action="toggle-detail" data-target="dailyTable">查看明细</button>
  </div>
  <div class="card-body">
    <div class="chart-filter-bar">
      <span class="filter-label">渠道筛选：</span>
      <button class="chart-filter-btn active-tf" data-action="toggle-daily-series" data-series="抖音投放">● 抖音投放</button>
      <button class="chart-filter-btn active-zr" data-action="toggle-daily-series" data-series="抖音自然流">● 抖音自然流</button>
      <button class="chart-filter-btn active-total" data-action="toggle-daily-series" data-series="合计">● 合计</button>
    </div>
    <div class="chart-box" id="dailyTrendChart" style="height:420px"></div>
    <div id="dailyTable" style="display:none;margin-top:16px">
      <table id="dailyTbl"></table>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <span>关键指标对比</span>
    <button class="btn" data-action="toggle-detail" data-target="compareTable">查看明细</button>
  </div>
  <div class="card-body">
    <div class="compare-grid">
      <div class="chart-box" id="avgBarChart"></div>
      <div class="chart-box" id="rateBarChart"></div>
    </div>
    <div style="margin-top:20px">
      <div class="chart-box" id="radarChart" style="height:400px"></div>
    </div>
    <div id="compareTable" style="display:none;margin-top:16px">
      <div class="legend-bar">
        <span><span class="legend-dot" style="background:#f6ffed;border:1px solid #b7eb8f"></span> 优于基准</span>
        <span><span class="legend-dot" style="background:#fcffe6;border:1px solid #eaff8f"></span> 接近基准</span>
        <span><span class="legend-dot" style="background:#fff7e6;border:1px solid #ffe58f"></span> 略低于基准</span>
        <span><span class="legend-dot" style="background:#fff1f0;border:1px solid #ffa39e"></span> 明显低于基准</span>
        <span><span class="legend-dot" style="background:#ffccc7;border:1px solid #ff7875"></span> 严重偏低 ⚠️</span>
        <span style="color:#999">基准 = 小红书渠道</span>
      </div>
      <table id="compareTbl"></table>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <span>月度对比分析</span>
    <button class="btn" data-action="toggle-detail" data-target="monthlyTable">查看明细</button>
  </div>
  <div class="card-body">
    <div class="compare-grid">
      <div class="chart-box" id="monthlyRateChart"></div>
      <div class="chart-box" id="monthlyLeadChart"></div>
    </div>
    <div id="monthlyTable" style="display:none;margin-top:16px">
      <table id="monthlyTbl"></table>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <span>中心适配性</span>
    <button class="btn" data-action="toggle-detail" data-target="centerTable">查看明细</button>
  </div>
  <div class="card-body">
    <div class="chart-box" id="centerChart" style="height:320px"></div>
    <div id="centerTable" style="display:none;margin-top:16px">
      <table id="centerTbl"></table>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">
    <span>团队适配性</span>
    <button class="btn" data-action="toggle-detail" data-target="teamTable">查看明细</button>
  </div>
  <div class="card-body">
    <div class="chart-box" id="teamChart" style="height:400px"></div>
    <div id="teamTable" style="display:none;margin-top:16px">
      <table id="teamTbl"></table>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-header">明细查询</div>
  <div class="card-body">
    <div class="search-bar">
      <span class="filter-label">渠道</span>
      <select id="filterChannel"><option value="">全部渠道</option><option value="抖音投放">抖音投放</option><option value="抖音自然流">抖音自然流</option></select>
      <span class="filter-label">中心</span>
      <select id="filterCenter"></select>
      <span class="filter-label">团队</span>
      <select id="filterTeam"></select>
      <span class="filter-label">顾问</span>
      <select id="filterConsultant"></select>
      <span class="filter-label">成交</span>
      <select id="filterDeal"><option value="">是否成交</option><option value="1">已成交</option><option value="0">未成交</option></select>
      <input type="text" id="filterKeyword" placeholder="搜索订单号" style="max-width:140px">
      <button class="btn btn-primary" data-action="search-detail">查询</button>
      <button class="btn" data-action="reset-filter">重置</button>
    </div>
    <div style="overflow-x:auto">
      <table id="detailTable">
        <thead><tr>
<th class="sortable" data-sort-key="业务日期" data-sort-type="string">日期<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="中心" data-sort-type="string">中心<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="主管" data-sort-type="string">主管<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="顾问" data-sort-type="string">顾问<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="渠道分类" data-sort-type="string">渠道<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="家庭单回溯后订单号" data-sort-type="string">订单号<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="是否成交" data-sort-type="number">成交<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="覆盖天次" data-sort-type="number">覆盖天次<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="回复天次" data-sort-type="number">回复天次<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="是否删除好友" data-sort-type="string">删除好友<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="对话回合数" data-sort-type="number">回合数<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="是否预约一通" data-sort-type="number">预约<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="第一次电话" data-sort-type="number">一通<span class="sort-icon"></span></th>
<th class="sortable" data-sort-key="是否二通" data-sort-type="number">二通<span class="sort-icon"></span></th>
</tr></thead>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
    <div style="margin-top:10px;font-size:12px;color:#999" id="detailCount"></div>
  </div>
</div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <span class="close-btn" data-action="close-modal">&times;</span>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

// ===== 颜色系统 =====
var BM = D.kpi['小红书基准'];
var REVERSE = {'微信删除率': true};
function cellStyle(val, metric, isAvg) {
  var bv = BM[metric];
  if (!bv || bv === 0) return '';
  var isRev = REVERSE[metric] || false;
  var ratio = isRev ? (val > 0 ? bv / val : 99) : (val / bv);
  if (ratio >= 1.2) return ' style="background:#f6ffed;color:#389e0d;font-weight:600"';
  if (ratio >= 1.0) return ' style="background:#fcffe6"';
  if (ratio >= 0.8) return ' style="background:#fff7e6"';
  if (ratio >= 0.5) return ' style="background:#fff1f0;color:#cf1322"';
  return ' style="background:#ffccc7;color:#a8071a;font-weight:600"';
}
function valCell(val, metric, isAvg) {
  var unit = isAvg ? '' : '%';
  var s = cellStyle(val, metric, isAvg);
  return '<td' + s + '>' + val + unit + '</td>';
}

// ===== 结论 =====
(function(){
  var ul = document.getElementById('conclusionList');
  var tf = D.kpi['抖音投放'];
  var zr = D.kpi['抖音自然流'];
  var xhs = D.kpi['小红书基准'];
  var items = [];
  if (tf['成交率'] < xhs['成交率'] * 0.5) {
    items.push('抖音投放成交率仅' + tf['成交率'] + '%，不足小红书基准(' + xhs['成交率'] + '%)的50%，严重偏低');
  }
  if (tf['平均覆盖天次'] < xhs['平均覆盖天次'] / 2) {
    items.push('抖音投放覆盖天次仅' + tf['平均覆盖天次'] + '天，不足小红书基准(' + xhs['平均覆盖天次'] + '天)的一半，触达深度严重不足');
  }
  if (tf['微信删除率'] > xhs['微信删除率'] * 1.3) {
    items.push('抖音投放微信删除率' + tf['微信删除率'] + '%，比小红书基准(' + xhs['微信删除率'] + '%)高出30%以上');
  }
  if (tf['电话预约率'] < xhs['电话预约率'] * 0.7) {
    items.push('抖音投放电话预约率' + tf['电话预约率'] + '%，远低于小红书基准(' + xhs['电话预约率'] + '%)');
  }
  if (tf['一通率'] < xhs['一通率'] * 0.6) {
    items.push('抖音投放一通率仅' + tf['一通率'] + '%，不足小红书基准的60%');
  }
  if (zr['成交率'] > tf['成交率'] * 2) {
    items.push('抖音自然流成交率(' + zr['成交率'] + '%)是投放(' + tf['成交率'] + '%)的' + (zr['成交率']/Math.max(tf['成交率'],0.01)).toFixed(1) + '倍，投放客户质量堪忧');
  }
  for (var i = 0; i < items.length; i++) {
    var li = document.createElement('li');
    li.textContent = items[i];
    ul.appendChild(li);
  }
})();

// ===== 明细查询（带颜色+筛选） =====
function renderDetail(data){
  var tbody = document.getElementById('detailBody');
  var html = '';
  for (var i = 0; i < data.length; i++) {
    var r = data[i];
    var dealTag = r['是否成交']==1 ? '<span class="tag tag-green">已成交</span>' : '<span class="tag tag-red">未成交</span>';
    var delTag = r['是否删除好友']==='是' ? '<span class="tag tag-red">已删除</span>' : '<span class="tag tag-green">正常</span>';
    var coverVal = r['覆盖天次'];
    var coverStyle = coverVal!=null ? (coverVal<3?' style="background:#ffccc7;color:#a8071a"':(coverVal<7?' style="background:#fff7e6"':' style="background:#f6ffed;color:#389e0d"')) : '';
    var coverCell = coverVal!=null ? '<td' + coverStyle + '>' + coverVal + '</td>' : '<td>-</td>';
    var replyVal = r['回复天次'];
    var replyStyle = replyVal!=null ? (replyVal<1?' style="background:#ffccc7;color:#a8071a"':(replyVal<3?' style="background:#fff7e6"':' style="background:#f6ffed;color:#389e0d"')) : '';
    var replyCell = replyVal!=null ? '<td' + replyStyle + '>' + replyVal + '</td>' : '<td>-</td>';
    var roundVal = r['对话回合数'];
    var roundStyle = roundVal!=null ? (roundVal<10?' style="background:#ffccc7;color:#a8071a"':(roundVal<30?' style="background:#fff7e6"':' style="background:#f6ffed;color:#389e0d"')) : '';
    var roundCell = roundVal!=null ? '<td' + roundStyle + '>' + roundVal + '</td>' : '<td>-</td>';
    html += '<tr>'
      + '<td>' + (r['业务日期']||'-') + '</td>'
      + '<td>' + (r['中心']||'-') + '</td>'
      + '<td>' + (r['主管']||'-') + '</td>'
      + '<td>' + (r['顾问']||'-') + '</td>'
      + '<td><span class="tag ' + (r['渠道分类']==='抖音投放'?'tag-blue':'tag-orange') + '">' + r['渠道分类'] + '</span></td>'
      + '<td>' + (r['家庭单回溯后订单号']||'-') + '</td>'
      + '<td>' + dealTag + '</td>'
      + coverCell + replyCell
      + '<td>' + delTag + '</td>'
      + roundCell
      + '<td>' + (r['是否预约一通']==1?'<span class="tag tag-green">已预约</span>':'<span class="tag" style="background:#f5f5f5;color:#999">未预约</span>') + '</td>'
      + '<td>' + (r['第一次电话']==1?'<span class="tag tag-green">已打通</span>':'<span class="tag" style="background:#f5f5f5;color:#999">未打通</span>') + '</td>'
      + '<td>' + (r['是否二通']==1?'<span class="tag tag-green">已二通</span>':'-') + '</td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
  document.getElementById('detailCount').textContent = '共 ' + data.length + ' 条记录';
}
renderDetail(DETAIL);

// ===== 筛选联动 =====
function getFilteredDetail(){
  var ch = document.getElementById('filterChannel').value;
  var center = document.getElementById('filterCenter').value;
  var team = document.getElementById('filterTeam').value;
  var consultant = document.getElementById('filterConsultant').value;
  var deal = document.getElementById('filterDeal').value;
  var kw = document.getElementById('filterKeyword').value.trim().toLowerCase();
  return DETAIL.filter(function(r){
    if (ch && r['渠道分类'] !== ch) return false;
    if (center && r['中心'] !== center) return false;
    if (team && r['主管'] !== team) return false;
    if (consultant && r['顾问'] !== consultant) return false;
    if (deal !== '' && String(r['是否成交']) !== deal) return false;
    if (kw) {
      var txt = (r['家庭单回溯后订单号']||'');
      if (txt.toLowerCase().indexOf(kw) < 0) return false;
    }
    return true;
  });
}

// 中心→团队→顾问联动
document.getElementById('filterCenter').addEventListener('change', function(){
  var v = this.value;
  var ft = document.getElementById('filterTeam');
  var fco = document.getElementById('filterConsultant');
  ft.innerHTML = '<option value="">全部团队</option>';
  fco.innerHTML = '<option value="">全部顾问</option>';
  var filtered = v ? DETAIL.filter(function(r){return r['中心']===v}) : DETAIL;
  var teams = [], consultants = [];
  for (var i = 0; i < filtered.length; i++) {
    if (filtered[i]['主管'] && teams.indexOf(filtered[i]['主管'])<0) teams.push(filtered[i]['主管']);
    if (filtered[i]['顾问'] && consultants.indexOf(filtered[i]['顾问'])<0) consultants.push(filtered[i]['顾问']);
  }
  teams.sort(); consultants.sort();
  for (var i = 0; i < teams.length; i++) ft.innerHTML += '<option value="' + teams[i] + '">' + teams[i] + '</option>';
  for (var i = 0; i < consultants.length; i++) fco.innerHTML += '<option value="' + consultants[i] + '">' + consultants[i] + '</option>';
});

  var v = this.value;

  fco.innerHTML = '<option value="">全部顾问</option>';
  var filtered = v ? DETAIL.filter(function(r){return r['主管']===v}) : DETAIL;
  var consultants = [];
  for (var i = 0; i < filtered.length; i++) {
    if (filtered[i]['顾问'] && consultants.indexOf(filtered[i]['顾问'])<0) consultants.push(filtered[i]['顾问']);
  }
  consultants.sort();
  for (var i = 0; i < consultants.length; i++) fco.innerHTML += '<option value="' + consultants[i] + '">' + consultants[i] + '</option>';
});

document.addEventListener('click', function(e){
  var target = e.target.closest('[data-action]');
  if (!target) return;
  var action = target.getAttribute('data-action');

  if (action === 'toggle-detail') {
    var tid = target.getAttribute('data-target');

      el.style.display = showing ? 'none' : 'block';

  }

  if (action === 'show-metric-modal') {
    showMetricModal(target.getAttribute('data-metric'));
  }

  if (action === 'search-detail') {
    renderDetail(getFilteredDetail());
  }

  if (action === 'toggle-daily-series') {
    toggleDailySeries(target.getAttribute('data-series'), target);
  }

  if (action === 'reset-filter') {
    document.getElementById('filterChannel').value = '';
    document.getElementById('filterCenter').value = '';
    document.getElementById('filterTeam').value = '';
    document.getElementById('filterConsultant').value = '';
    document.getElementById('filterDeal').value = '';

function showMetricModal(metric){
  var modal = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = metric + ' - 详细分析';
  var isAvg = D.avg_metrics.indexOf(metric) >= 0;
  var unit = isAvg ? '' : '%';
  var body = '<p style="color:#666;margin-bottom:12px">该指标在各渠道的详细表现：</p>';
  body += '<table><thead><tr><th>渠道</th><th>值</th><th>vs小红书</th></tr></thead><tbody>';
  var xhsVal = D.kpi['小红书基准'][metric] || 0;
  var channels = ['抖音投放','抖音自然流','小红书基准','全渠道'];
  for (var i = 0; i < channels.length; i++) {
    var v = D.kpi[channels[i]][metric] || 0;
    var diff = v - xhsVal;
    body += '<tr><td>' + channels[i] + '</td>' + valCell(v, metric, isAvg)
      + '<td>' + (channels[i]==='小红书基准'?'-':'<span class="tag ' + (diff<0?'tag-red':'tag-green') + '">' + (diff>0?'+':'') + diff.toFixed(2) + unit + '</span>') + '</td></tr>';
  }
  body += '</tbody></table>';
  body += '<h4 style="margin:16px 0 8px">月度趋势</h4><table><thead><tr><th>月份</th><th>抖音投放</th><th>抖音自然流</th></tr></thead><tbody>';
  for (var i = 0; i < D.monthly.length; i++) {
    body += '<tr><td>' + D.monthly[i].month + '</td>'
      + valCell(D.monthly[i]['抖音投放'][metric]||0, metric, isAvg)
      + valCell(D.monthly[i]['抖音自然流'][metric]||0, metric, isAvg)
      + '</tr>';
  }
  body += '</tbody></table>';
  document.getElementById('modalBody').innerHTML = body;
  modal.classList.add('show');
}

// ===== 通用表格排序 =====
var detailSortState = {key: null, dir: 'asc'};

// Detail table sorting
function sortDetailData(data, key, type, dir) {
  return data.slice().sort(function(a, b) {
    var va = a[key], vb = b[key];
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (type === 'number') {
      va = Number(va) || 0;
      vb = Number(vb) || 0;
      return dir === 'asc' ? va - vb : vb - va;
    }
    va = String(va);
    vb = String(vb);
    var cmp = va.localeCompare(vb, 'zh-CN');
    return dir === 'asc' ? cmp : -cmp;
  });
}

// DOM-based table sorting for static tables (compare, monthly, center, team)
function sortTableDOM(table, colIdx, type, dir) {
  var tbody = table.querySelector('tbody');
  if (!tbody) return;
  var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
  rows.sort(function(a, b) {
    var ca = a.children[colIdx], cb = b.children[colIdx];
    if (!ca || !cb) return 0;
    // Extract numeric value from content (strip tags)
    var vaText = ca.textContent.trim().replace(/[^\d.\-]/g, '');
    var vbText = cb.textContent.trim().replace(/[^\d.\-]/g, '');
    if (type === 'number') {
      var va = parseFloat(vaText) || 0;
      var vb = parseFloat(vbText) || 0;
      return dir === 'asc' ? va - vb : vb - va;
    }
    var va = ca.textContent.trim();
    var vb = cb.textContent.trim();
    var cmp = va.localeCompare(vb, 'zh-CN');
    return dir === 'asc' ? cmp : -cmp;
  });
  for (var i = 0; i < rows.length; i++) {
    tbody.appendChild(rows[i]);
  }
}

// Click handler for sortable headers
document.addEventListener('click', function(e) {
  var th = e.target.closest('th.sortable');
  if (!th) return;
  var table = th.closest('table');
  if (!table) return;

  var sortKey = th.getAttribute('data-sort-key');
  var sortType = th.getAttribute('data-sort-type') || 'string';

  // Determine new sort direction
  var newDir = 'asc';
  if (th.classList.contains('sort-asc')) {
    newDir = 'desc';
  }

  // Clear sort state on all headers in this table
  var headers = table.querySelectorAll('th.sortable');
  for (var i = 0; i < headers.length; i++) {
    headers[i].classList.remove('sort-asc', 'sort-desc');
  }

  // Set new sort state
  th.classList.add(newDir === 'asc' ? 'sort-asc' : 'sort-desc');

  // Perform sort
  if (table.id === 'detailTable') {
    // Detail table: sort data and re-render
    detailSortState = {key: sortKey, dir: newDir};
    var filtered = getFilteredDetail();
    var sorted = sortDetailData(filtered, sortKey, sortType, newDir);
    renderDetail(sorted);
    // Re-apply sort indicator after re-render (thead is not touched by renderDetail)
    var ths = table.querySelectorAll('th.sortable');
    for (var i = 0; i < ths.length; i++) {
      ths[i].classList.remove('sort-asc', 'sort-desc');
      if (ths[i].getAttribute('data-sort-key') === sortKey) {
        ths[i].classList.add(newDir === 'asc' ? 'sort-asc' : 'sort-desc');
      }
    }
  } else {
    // Static tables: DOM-based sorting
    var colIdx = Array.prototype.indexOf.call(table.querySelectorAll('th'), th);
    sortTableDOM(table, colIdx, sortType, newDir);
  }
});

// ===== Override renderDetail to respect sort state =====
var _origRenderDetail = renderDetail;
renderDetail = function(data) {
  if (detailSortState.key) {
    var th = document.querySelector('#detailTable th[data-sort-key="' + detailSortState.key + '"]');
    var sortType = th ? th.getAttribute('data-sort-type') : 'string';
    data = sortDetailData(data, detailSortState.key, sortType, detailSortState.dir);
  }
  _origRenderDetail(data);
};





// ===== 每日进线量走势图 (Line Chart + Filters) =====
var dailyChart, dailyDates, dailyTfData, dailyZrData, dailyTotalData;
(function(){
  var dailyMap = {};
  for (var i = 0; i < DETAIL.length; i++) {
    var r = DETAIL[i];
    var date = r['业务日期'];
    var channel = r['渠道分类'];
    if (!date || !channel) continue;
    if (!dailyMap[date]) {
      dailyMap[date] = {'抖音投放': 0, '抖音自然流': 0};
    }
    if (channel === '抖音投放' || channel === '抖音自然流') {
      dailyMap[date][channel]++;
    }
  }
  
  dailyDates = Object.keys(dailyMap).sort();
  dailyTfData = [];
  dailyZrData = [];
  dailyTotalData = [];
  for (var i = 0; i < dailyDates.length; i++) {
    var tf = dailyMap[dailyDates[i]]['抖音投放'];
    var zr = dailyMap[dailyDates[i]]['抖音自然流'];
    dailyTfData.push(tf);
    dailyZrData.push(zr);
    dailyTotalData.push(tf + zr);
  }
  
  function movingAvg(arr, win) {
    var result = [];
    for (var i = 0; i < arr.length; i++) {
      var sum = 0, cnt = 0;
      for (var j = Math.max(0, i - win + 1); j <= i; j++) {
        sum += arr[j]; cnt++;
      }
      result.push(+(sum / cnt).toFixed(1));
    }
    return result;
  }
  var tfMA = movingAvg(dailyTfData, 3);
  var zrMA = movingAvg(dailyZrData, 3);
  
  var el = document.getElementById('dailyTrendChart');
  if (el) {
    dailyChart = echarts.init(el);
    dailyChart.setOption({
      tooltip: {
        trigger: 'axis',
        backgroundColor: 'rgba(255,255,255,.95)',
        borderColor: '#e0e0e0',
        borderWidth: 1,
        textStyle: {color: '#333', fontSize: 12},
        axisPointer: {type: 'cross', crossStyle: {color: '#ccc'}},
        formatter: function(params) {
          var s = '<b>' + params[0].axisValue + '</b><br/>';
          for (var i = 0; i < params.length; i++) {
            var p = params[i];
            s += p.marker + ' ' + p.seriesName + ': <b>' + p.value + '</b>单<br/>';
          }
          return s;
        }
      },
      legend: {
        data: ['抖音投放', '抖音自然流', '合计', '投放(3日均线)', '自然流(3日均线)'],
        bottom: 5,
        textStyle: {fontSize: 11},
        itemWidth: 18, itemHeight: 10
      },
      grid: {top: 40, bottom: 55, left: 50, right: 30},
      xAxis: {
        type: 'category',
        data: dailyDates,
        boundaryGap: false,
        axisLabel: {rotate: 45, fontSize: 11, formatter: function(val) { return val.substring(5); }},
        axisLine: {lineStyle: {color: '#ddd'}},
        axisTick: {alignWithLabel: true}
      },
      yAxis: {
        type: 'value',
        name: '进线量(单)',
        nameTextStyle: {fontSize: 11, color: '#888'},
        axisLabel: {fontSize: 11},
        splitLine: {lineStyle: {type: 'dashed', color: '#f0f0f0'}},
        axisLine: {show: false}
      },
      series: [
        {
          name: '抖音投放', type: 'line', data: dailyTfData,
          smooth: true, symbol: 'circle', symbolSize: 6,
          lineStyle: {width: 2.5, color: '#5470c6'},
          itemStyle: {color: '#5470c6'},
          areaStyle: {color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(84,112,198,.2)'},{offset:1,color:'rgba(84,112,198,.02)'}])},
          emphasis: {focus: 'series'}
        },
        {
          name: '抖音自然流', type: 'line', data: dailyZrData,
          smooth: true, symbol: 'circle', symbolSize: 6,
          lineStyle: {width: 2.5, color: '#91cc75'},
          itemStyle: {color: '#91cc75'},
          areaStyle: {color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(145,204,117,.2)'},{offset:1,color:'rgba(145,204,117,.02)'}])},
          emphasis: {focus: 'series'}
        },
        {
          name: '合计', type: 'line', data: dailyTotalData,
          smooth: true, symbol: 'diamond', symbolSize: 5,
          lineStyle: {width: 2, color: '#fac852'},
          itemStyle: {color: '#fac852'},
          emphasis: {focus: 'series'}
        },
        {
          name: '投放(3日均线)', type: 'line', data: tfMA,
          smooth: true, symbol: 'none',
          lineStyle: {width: 1.5, color: '#5470c6', type: 'dashed'},
          itemStyle: {color: '#5470c6'}
        },
        {
          name: '自然流(3日均线)', type: 'line', data: zrMA,
          smooth: true, symbol: 'none',
          lineStyle: {width: 1.5, color: '#91cc75', type: 'dashed'},
          itemStyle: {color: '#91cc75'}
        }
      ]
    });
    window.addEventListener('resize', function(){dailyChart.resize()});
  }
  
  var tbl = document.getElementById('dailyTbl');
  if (tbl) {
    var thtml = '<thead><tr><th class="sortable" data-sort-key="0" data-sort-type="string">日期<span class="sort-icon"></span></th><th class="sortable" data-sort-key="1" data-sort-type="number">抖音投放<span class="sort-icon"></span></th><th class="sortable" data-sort-key="2" data-sort-type="number">抖音自然流<span class="sort-icon"></span></th><th class="sortable" data-sort-key="3" data-sort-type="number">合计<span class="sort-icon"></span></th></tr></thead><tbody>';
    for (var i = 0; i < dailyDates.length; i++) {
      thtml += '<tr><td>' + dailyDates[i] + '</td><td>' + dailyTfData[i] + '</td><td>' + dailyZrData[i] + '</td><td><b>' + dailyTotalData[i] + '</b></td></tr>';
    }
    var tfSum = dailyTfData.reduce(function(a,b){return a+b},0);
    var zrSum = dailyZrData.reduce(function(a,b){return a+b},0);
    thtml += '<tr style="background:#f0f2f5;font-weight:600"><td>合计</td><td>' + tfSum + '</td><td>' + zrSum + '</td><td>' + (tfSum+zrSum) + '</td></tr>';
    thtml += '<tr style="background:#f8f9fa;font-weight:500;color:#666"><td>日均</td><td>' + (tfSum/dailyDates.length).toFixed(1) + '</td><td>' + (zrSum/dailyDates.length).toFixed(1) + '</td><td>' + ((tfSum+zrSum)/dailyDates.length).toFixed(1) + '</td></tr>';
    thtml += '</tbody>';
    tbl.innerHTML = thtml;
  }
})();

// Toggle daily chart series visibility
var dailySeriesVisible = {'抖音投放': true, '抖音自然流': true, '合计': true};
function toggleDailySeries(seriesName, btn) {
  if (!dailyChart) return;
  dailySeriesVisible[seriesName] = !dailySeriesVisible[seriesName];
  var visible = dailySeriesVisible[seriesName];
  if (visible) {
    if (seriesName === '抖音投放') btn.className = 'chart-filter-btn active-tf';
    else if (seriesName === '抖音自然流') btn.className = 'chart-filter-btn active-zr';
    else btn.className = 'chart-filter-btn active-total';
  } else {
    btn.className = 'chart-filter-btn';
  }
  var seriesMap = {'抖音投放': [0, 3], '抖音自然流': [1, 4], '合计': [2]};
  var indices = seriesMap[seriesName] || [];
  var option = dailyChart.getOption();
  for (var i = 0; i < indices.length; i++) {
    option.series[indices[i]].lineStyle.opacity = visible ? 1 : 0;
    option.series[indices[i]].itemStyle.opacity = visible ? 1 : 0;
    if (option.series[indices[i]].areaStyle) {
      option.series[indices[i]].areaStyle.opacity = visible ? 1 : 0;
    }
  }
  dailyChart.setOption(option);
}
